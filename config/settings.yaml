# CyberAI - Pentest Toolkit Configuration

target:
  # Default target scope
  allowed_domains: []
  max_depth: 5
  rate_limit: 10  # requests per second

scanners:
  nmap:
    enabled: true
    default_args: "-sV -sC -T4"
  dirbust:
    enabled: true
    wordlist: "/usr/share/wordlists/dirb/common.txt"
    threads: 20
  port_scan:
    enabled: true
    top_ports: 1000

exploits:
  auto_detect: true
  safe_mode: true  # Only proof-of-concept, no destructive actions

reporting:
  format: ["html", "pdf", "json"]
  output_dir: "./reports"
  include_evidence: true

llm:
  provider: ollama
  host: "http://127.0.0.1:11434"
  model: "qwen3-coder:30b"
  enabled: true  # Use AI for vulnerability analysis
